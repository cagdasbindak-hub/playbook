<style>
/* Layout: one screen. The arena fills it; a broadcast-style caption and the controls float at the bottom. */
:root {
  --ink: #0B1622;          /* night sky behind the stadium */
  --glass: rgba(12, 24, 38, 0.74);
  --glass-strong: rgba(9, 18, 29, 0.9);
  --line: rgba(255, 255, 255, 0.14);
  --text: #F3F7FB;
  --muted: #A6B8CA;
  --accent: #5AA9F0;       /* Playbook navy, lifted for the dark arena */
  --accent-ink: #06121F;
  --blue: #1F5FAE;
  --red: #D23B3B;
  --yellow: #F2C14E;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
body { touch-action: none; }
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(3, 8, 14, 0.55) 100%); }

/* Top bar */
.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 3;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(to bottom, rgba(6, 12, 20, 0.82), rgba(6, 12, 20, 0));
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brand b { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.02em; }
.chip { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); }
.chip.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.pick { margin-left: auto; position: relative; pointer-events: auto; min-width: 0; max-width: 62%; }
.pick select {
  appearance: none; -webkit-appearance: none; width: 100%;
  font: 600 14px/1.2 var(--body); color: var(--text);
  background: var(--glass); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 30px 9px 12px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.pick::after { content: ""; position: absolute; right: 12px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }

/* Who drew it */
.owner { position: fixed; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 60px); display: flex; gap: 6px; align-items: center; pointer-events: none; }
.owner span { font: 600 12px/1 var(--body); color: var(--muted); background: var(--glass); border: 1px solid var(--line); padding: 5px 8px; border-radius: 999px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* Bottom: caption + controls */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 8px; justify-items: center;
  background: linear-gradient(to top, rgba(6, 12, 20, 0.9) 40%, rgba(6, 12, 20, 0));
  padding-top: 40px;
}
.dock > * { width: 100%; max-width: 640px; }
.caption { display: flex; align-items: stretch; min-height: 48px; border-radius: 8px; overflow: hidden; background: var(--glass-strong); border: 1px solid var(--line); }
.caption .step { flex-shrink: 0; display: grid; place-content: center; padding: 0 12px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; line-height: 1; }
.caption .step small { display: block; font-size: 11px; letter-spacing: 0.1em; opacity: 0.75; margin-bottom: 2px; }
.caption .note { padding: 8px 12px; font: 500 15px/1.3 var(--body); display: flex; align-items: center; min-width: 0; }
.caption .note span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.timeline { position: relative; height: 22px; }
.timeline input { position: absolute; inset: 0; width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; touch-action: pan-x; }
.timeline input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 0%), rgba(255, 255, 255, 0.2) var(--p, 0%)); }
.timeline input::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.2); }
.timeline input::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
.timeline input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; margin-top: -7px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }
.timeline input::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #fff; }
.ticks { position: absolute; left: 9px; right: 9px; top: 50%; height: 0; pointer-events: none; }
.ticks i { position: absolute; top: -5px; width: 2px; height: 10px; border-radius: 1px; background: rgba(255, 255, 255, 0.55); transform: translateX(-1px); }

.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.transport { display: flex; align-items: center; gap: 6px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.btn.play { width: 52px; height: 52px; background: #fff; color: var(--accent-ink); border: 0; }
.btn.play svg { width: 22px; height: 22px; }
.btn.speed { width: auto; min-width: 44px; padding: 0 12px; border-radius: 22px; font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: 0.04em; }
.cams { display: flex; padding: 3px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); }
.cams button { border: 0; background: transparent; padding: 9px 11px; border-radius: 9px; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.cams button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hint { position: fixed; z-index: 2; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 104px); transform: translateX(-50%); font: 500 13px/1 var(--body); color: var(--text); background: var(--glass); border: 1px solid var(--line); padding: 8px 12px; border-radius: 999px; transition: opacity 0.6s; white-space: nowrap; pointer-events: none; }
.hint.gone { opacity: 0; }

.loading { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; gap: 14px; justify-items: center; background: var(--ink); transition: opacity 0.5s; }
.loading.gone { opacity: 0; pointer-events: none; }
.loading p { margin: 0; max-width: 300px; padding: 0 16px; text-align: center; line-height: 1.35; font-family: var(--display); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { max-width: 320px; text-align: center; font: 500 15px/1.4 var(--body); color: var(--text); padding: 0 16px; }

@media (max-width: 420px) {
  .cams button { padding: 9px 8px; font-size: 13px; }
  .btn { width: 40px; height: 40px; }
  .btn.play { width: 48px; height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 3s; }
}

        const stand = new THREE.Mesh(new THREE.BoxGeometry(s.len + 8 + tier * 6, 1.6, 3), dark);
        const out = 4 + tier * 3;
        stand.position.set(s.x + Math.sin(-s.ry) * 0 + (s.ry === -Math.PI / 2 ? out : s.ry === Math.PI / 2 ? -out : 0), 0.8 + tier * 1.6, s.z + (s.ry === 0 ? -out : s.ry === Math.PI ? out : 0));
        stand.rotation.y = s.ry;
        arena.add(stand);
      }
    }
    // Floodlight towers in the corners.
    const pole = new THREE.MeshStandardMaterial({ color: 0x2a3a4c, roughness: 0.7 });
    const lamp = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff4dc, emissiveIntensity: 2.2 });
    // Only behind the far stand, so no tower ever stands between the camera and the pitch.
    for (const sx of [-1, 1]) for (const sz of [-1]) {
      const px = sx * (F.w / 2 + 14), pz = sz * (F.h / 2 + 30);
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 38, 8), pole);
      p.position.set(px, 19, pz); arena.add(p);
      const head = new THREE.Mesh(new THREE.BoxGeometry(6, 3.2, 0.6), lamp);
      head.position.set(px, 39, pz); head.lookAt(0, 0, 0); arena.add(head);
    }
  }
  scene.add(arena);

  // Shadows cover the pitch.
  const s = key.shadow.camera;
  const half = Math.max(F.w, F.h) / 2 + 8;
  s.left = -half; s.right = half; s.top = half; s.bottom = -half; s.near = 1; s.far = 260;
  s.updateProjectionMatrix();
  key.position.set(-F.w * 0.35, 70, F.h * 0.55);
  key.target.position.set(0, 0, 0);
}

function toWorld(x, y, field = current.field) {
  const F = FIELD[field];
  return new THREE.Vector3(x - F.w / 2, 0, y - F.h / 2);
}

// ───────────────────────────────────────────────────────────── pieces
const SKIN = 0xe8b98c;
const HAIR = [0x2b1d14, 0x3b2a1e, 0x14100c, 0x6b4a2b];

function numberTexture(text, bg) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(64, 64, 56, 0, Math.PI * 2);
  g.fillStyle = bg; g.fill();
  g.lineWidth = 8; g.strokeStyle = 'rgba(255,255,255,0.95)'; g.stroke();
  g.fillStyle = '#ffffff';
  g.font = `700 ${String(text).length > 1 ? 58 : 70}px "Barlow Condensed", "Arial Narrow", Arial, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 64, 68);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function shirtNumber(text) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.font = '700 92px "Barlow Condensed", "Arial Narrow", Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 64, 70);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;

}

function makePlayer(p) {
  const kit = KIT[p.kind];
  const s = (p.sz || 1) * 1.08;
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);
  const mat = (color, rough = 0.7) => new THREE.MeshStandardMaterial({ color, roughness: rough });
  const shirt = mat(kit.shirt, 0.6), shorts = mat(kit.shorts), socks = mat(kit.socks), skin = mat(SKIN, 0.8), boot = mat(0x111111, 0.4);
  const cast = (m) => { m.castShadow = true; return m; };

  const legs = [];
  for (const side of [-1, 1]) {
    const hip = new THREE.Group();
    hip.position.set(0.11 * side, 0.8, 0);
    const thigh = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.26, 4, 8), skin));
    thigh.position.y = -0.2;
    const leg = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.095, 0.24, 12), shorts));
    leg.position.y = -0.1;
    const shin = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.068, 0.3, 4, 8), socks));
    shin.position.y = -0.55;
    const foot = cast(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.24), boot));
    foot.position.set(0, -0.76, 0.05);
    hip.add(thigh, leg, shin, foot);
    body.add(hip);
    legs.push(hip);
  }
  const pants = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.2, 0.14, 14), shorts));
  pants.position.y = 0.9;
  const torso = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.36, 6, 14), shirt));
  torso.position.y = 1.2;
  torso.scale.set(1, 1, 0.74);
  const arms = [];
  for (const side of [-1, 1]) {
    const sh = new THREE.Group();
    sh.position.set(0.27 * side, 1.4, 0);
    const sleeve = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.068, 0.12, 4, 8), shirt));
    sleeve.position.y = -0.1;
    const arm = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.32, 4, 8), p.kind === 'keeper' ? mat(0xf7f7f7) : skin));
    arm.position.y = -0.36;
    sh.add(sleeve, arm);
    sh.rotation.z = side * 0.12;
    body.add(sh);
    arms.push(sh);
  }
  const head = cast(new THREE.Mesh(new THREE.SphereGeometry(0.125, 18, 14), skin));
  head.position.y = 1.62;
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.13, 18, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), mat(HAIR[Math.floor(Math.random() * HAIR.length)], 0.9));
  hair.position.y = 1.635;
  body.add(pants, torso, head, hair);
  if (p.label) {
    const back = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.26), new THREE.MeshStandardMaterial({ map: shirtNumber(p.label), transparent: true, roughness: 0.6 }));
    back.position.set(0, 1.26, -0.15);
    back.rotation.y = Math.PI;
    body.add(back);
  }
  root.scale.setScalar(s);

  const badge = new THREE.Sprite(new THREE.SpriteMaterial({ map: numberTexture(p.label ?? '', kit.badge), depthTest: false, transparent: true }));
  badge.renderOrder = 10;
  badge.visible = !!p.label;
  scene.add(badge);

  return { kind: 'player', root, body, legs, arms, badge, phase: Math.random() * 6, yaw: 0, scale: s, last: null };
}

function ballTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f4f4'; g.fillRect(0, 0, 256, 128);
  g.fillStyle = '#1b1b1b';
  const spots = [[32, 20], [96, 20], [160, 20], [224, 20], [0, 64], [64, 64], [128, 64], [192, 64], [256, 64], [32, 108], [96, 108], [160, 108], [224, 108]];
  for (const [x, y] of spots) {
    g.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      g.lineTo(x + Math.cos(a) * 15, y + Math.sin(a) * 13);
    }
    g.closePath(); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeThing(p) {
  const z = p.sz || 1;
  const rot = -THREE.MathUtils.degToRad(p.rot || 0);
  let mesh;
  if (p.kind === 'ball') {
    const r = 0.11 * 1.6 * z;
    mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), new THREE.MeshStandardMaterial({ map: ballTexture(), roughness: 0.45 }));
    mesh.castShadow = true;
    return { kind: 'ball', root: mesh, r, last: null };
  }
  if (p.kind === 'cone') {
    const g = new THREE.Group();
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.17 * z, 0.42 * z, 18), new THREE.MeshStandardMaterial({ color: 0xff7a1a, roughness: 0.55, emissive: 0x3a1500 }));
    cone.position.y = 0.21 * z; cone.castShadow = true;
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * z, 0.22 * z, 0.03, 18), cone.material);
    base.position.y = 0.015;
    g.add(cone, base);
    return { kind: 'static', root: g };
  }
  if (p.kind === 'minigoal') {
    const g = makeGoal(3 * z, 1 * z, 1.2 * z, 0.04);
    g.rotation.y = rot;
    return { kind: 'static', root: g };
  }
  if (p.kind === 'goal') {
    const g = makeGoal(7.32 * z, 2.44 * z, 2 * z, 0.06);
    g.rotation.y = rot;
    return { kind: 'static', root: g };
  }
  if (p.kind === 'ladder') {
    const g = new THREE.Group();
    const w = 1 * z, l = 5 * z;
    const m = new THREE.MeshStandardMaterial({ color: 0xffd24d, roughness: 0.5, emissive: 0x2a2000 });
    for (const sx of [-w / 2, w / 2]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, l), m); rail.position.set(sx, 0.02, 0); g.add(rail);
    }
    for (let i = 1; i < 8; i++) {
      const rung = new THREE.Mesh(new THREE.BoxGeometry(w, 0.025, 0.04), m); rung.position.set(0, 0.02, -l / 2 + (l / 8) * i); g.add(rung);
    }
    g.rotation.y = rot;
    return { kind: 'static', root: g };
  }
  if (p.kind === 'zone') {
    const w = (p.w || 12) * z, h = (p.h || 8) * z;
    const g = new THREE.Group();
    const fillM = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: 0xffd666, transparent: true, opacity: 0.16, depthWrite: false }));
    fillM.rotation.x = -Math.PI / 2; fillM.position.y = 0.04;
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), new THREE.LineDashedMaterial({ color: 0xffd666, dashSize: 0.8, gapSize: 0.6, transparent: true, opacity: 0.95 }));
    edge.computeLineDistances(); edge.rotation.x = -Math.PI / 2; edge.position.y = 0.05;
    g.add(fillM, edge);
    g.rotation.y = rot;
    return { kind: 'static', root: g };
  }
  if (p.kind === 'ring') {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.8 * z, 0.035, 8, 32), new THREE.MeshStandardMaterial({ color: 0xffd24d }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04;
    return { kind: 'static', root: ring };
  }
  if (p.kind === 'pole') {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.6 * z, 10), new THREE.MeshStandardMaterial({ color: 0xffd24d }));
    pole.position.y = 0.8 * z; pole.castShadow = true;
    const g = new THREE.Group(); g.add(pole);
    return { kind: 'static', root: g };
  }
  return null;
}

// ───────────────────────────────────────────────────────────── timeline from the drawing's steps
const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
const easeOut = (t) => 1 - Math.pow(1 - t, 2.2);

function makeCurve(pts) {
  if (pts.length === 2) return new THREE.LineCurve3(pts[0], pts[1]);
  return new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
}

function compile(drawing) {
  const d = drawing.diagram;
  const field = d.field in FIELD ? d.field : 'full';
  const pos = {};
  for (const p of d.pieces) pos[p.id] = toWorld(p.x, p.y, field);
  const kinds = Object.fromEntries(d.pieces.map((p) => [p.id, p.kind]));
  const steps = [];
  for (const st of d.steps) {
    const moves = {};
    let longest = 0, onlyBall = true;
    for (const [id, m] of Object.entries(st.moves || {})) {
      if (!pos[id] || !m.pts?.length) continue;
      const pts = [pos[id].clone(), ...m.pts.map((q) => toWorld(q.x, q.y, field))];
      const curve = makeCurve(pts);
      const len = curve.getLength();
      moves[id] = { curve, len, style: m.style, follows: m.follows, kind: kinds[id] };
      if (kinds[id] !== 'ball') onlyBall = false;
      longest = Math.max(longest, kinds[id] === 'ball' ? len * 0.5 : len);
    }
    // A pass alone is quick; runs take longer – roughly like the drawing tool, a little calmer.
    const dur = onlyBall ? THREE.MathUtils.clamp(longest / 7, 0.8, 2.4) : THREE.MathUtils.clamp(longest / 5.2, 1.2, 4.2);
    steps.push({ note: (st.note || '').trim(), moves, dur });
    for (const [id, m] of Object.entries(moves)) pos[id] = m.curve.getPoint(1);
  }
  // Timeline: a short start, each step followed by a breath, a longer pause before it starts over.
  const PRE = 1.2, HOLD = 0.55, END = 1.8;
  let t = PRE;
  for (const s of steps) { s.start = t; t += s.dur; s.end = t; t += HOLD; }
  return { drawing, field, steps, total: t + END - HOLD, pre: PRE };
}

// Where every piece is at time t (stateless, so scrubbing just works).
function snapshot(plan, t) {
  const d = plan.drawing.diagram;
  const out = {};
  for (const p of d.pieces) out[p.id] = toWorld(p.x, p.y, plan.field);
  let active = -1, lofts = {};
  for (let i = 0; i < plan.steps.length; i++) {
    const s = plan.steps[i];
    if (t < s.start) break;
    const k = Math.min(1, (t - s.start) / s.dur);
    if (t <= s.end) active = i;
    for (const [id, m] of Object.entries(s.moves)) {
      if (m.kind === 'ball' && m.follows && s.moves[m.follows]) {
        const pm = s.moves[m.follows];
        const u = ease(k);
        const at = pm.curve.getPoint(u);
        const tan = pm.curve.getTangent(Math.min(u, 0.999));
        out[id] = k >= 1 ? m.curve.getPoint(1) : at.add(tan.setY(0).normalize().multiplyScalar(0.75));
      } else if (m.kind === 'ball') {
        out[id] = m.curve.getPoint(easeOut(k));
        if (k > 0 && k < 1 && m.len > 18) lofts[id] = Math.min((m.len - 18) * 0.13, 4.2) * 4 * k * (1 - k);
      } else {
        out[id] = m.curve.getPoint(ease(k));
      }
    }
    if (t < s.end) break;
  }
  if (active < 0) {
    for (let i = plan.steps.length - 1; i >= 0; i--) if (t >= plan.steps[i].start) { active = i; break; }
  }
  return { at: out, lofts, active };
}

// ───────────────────────────────────────────────────────────── path ribbons (runs, dribbles, passes)
function ribbon(points, width, color, opacity) {
  const v = [], idx = [];
  for (let i = 0; i < points.length; i++) {
    const a = points[Math.max(0, i - 1)], b = points[Math.min(points.length - 1, i + 1)];
    const dir = new THREE.Vector3().subVectors(b, a).setY(0).normalize();
    const nrm = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(width / 2);
    const p = points[i];
    v.push(p.x + nrm.x, 0.07, p.z + nrm.z, p.x - nrm.x, 0.07, p.z - nrm.z);
    if (i > 0) { const o = (i - 1) * 2; idx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.setIndex(idx);
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide }));
}

function arrowHead(at, dir, size, color, opacity) {
  const d = dir.clone().setY(0).normalize();
  const n = new THREE.Vector3(-d.z, 0, d.x);
  const tip = at.clone().addScaledVector(d, size * 0.4);
  const l = at.clone().addScaledVector(d, -size * 0.8).addScaledVector(n, size * 0.55);
  const r = at.clone().addScaledVector(d, -size * 0.8).addScaledVector(n, -size * 0.55);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([tip.x, 0.08, tip.z, l.x, 0.08, l.z, r.x, 0.08, r.z], 3));
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide }));
}

function pathGroup(step) {
  const g = new THREE.Group();
  for (const [, m] of Object.entries(step.moves)) {
    if (m.kind === 'ball' && m.follows) continue;
    if (m.len < 0.6) continue;
    const n = Math.max(8, Math.ceil(m.len * 3));
    let pts = m.curve.getSpacedPoints(n);
    const color = m.kind === 'ball' ? 0xffffff : KIT[m.kind]?.run ?? 0xffffff;
    const w = m.kind === 'ball' ? 0.13 : 0.15;
    if (m.style === 'dribble') {
      pts = pts.map((p, i) => {
        const u = i / n;
        const tan = m.curve.getTangent(Math.min(u, 0.999)).setY(0).normalize();
        const off = Math.sin((u * m.len) / 0.9 * Math.PI) * 0.28 * Math.min(1, u * 6, (1 - u) * 6);
        return p.clone().add(new THREE.Vector3(-tan.z, 0, tan.x).multiplyScalar(off));
      });
      g.add(ribbon(pts.slice(0, -2), w, color, 0.92));
    } else if (m.kind === 'ball') {
      g.add(ribbon(pts.slice(0, -1), w, color, 0.92));
    } else {
      // Runs without the ball: dashed.
      const dash = 1.1, gap = 0.65;
      let seg = [], acc = 0, on = true;
      for (let i = 1; i < pts.length - 1; i++) {
        const dl = pts[i].distanceTo(pts[i - 1]);
        acc += dl;
        if (on) seg.push(pts[i - 1]);
        if (acc > (on ? dash : gap)) {
          if (on && seg.length > 1) { seg.push(pts[i]); g.add(ribbon(seg, w, color, 0.92)); }
          seg = []; acc = 0; on = !on;
        }
      }
      if (on && seg.length > 1) g.add(ribbon(seg, w, color, 0.92));
    }
    const end = m.curve.getPoint(1);
    g.add(arrowHead(end, m.curve.getTangent(0.999), m.kind === 'ball' ? 0.55 : 0.6, color, 0.95));
  }
  return g;
}

// ───────────────────────────────────────────────────────────── loading a drawing
let current = null;   // { drawing, field, steps, total, pre }
let things = {};      // id → { kind, root, ... }
let paths = [];       // per step: THREE.Group
let ballIds = [];
let t = 0, playing = !reduceMotion, speed = 1;

function load(index) {
  for (const th of Object.values(things)) { scene.remove(th.root); if (th.badge) scene.remove(th.badge); }
  for (const g of paths) scene.remove(g);
  things = {}; paths = []; ballIds = [];
  current = compile(DRAWINGS[index]);
  buildArena(current.field, current.drawing.diagram.pieces);
  for (const p of current.drawing.diagram.pieces) {
    const th = p.kind === 'team' || p.kind === 'opp' || p.kind === 'keeper' ? makePlayer(p) : makeThing(p);
    if (!th) continue;
    th.root.position.copy(toWorld(p.x, p.y, current.field));
    if (th.kind === 'ball') { th.root.position.y = th.r; ballIds.push(p.id); }
    scene.add(th.root);
    things[p.id] = th;
  }
  for (const s of current.steps) { const g = pathGroup(s); g.visible = false; scene.add(g); paths.push(g); }
  frame = computeFrame();
  // Sharper shadows: the shadow map only needs to cover where the players are.
  const sc = key.shadow.camera;
  const r = Math.max(frame.box.max.x - frame.box.min.x, frame.box.max.z - frame.box.min.z) / 2 + 6;
  sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 1; sc.far = 260;
  sc.updateProjectionMatrix();
  key.target.position.copy(frame.c);
  key.position.copy(frame.c).add(new THREE.Vector3(-30, 70, 45));
  t = 0;
  buildTicks();
  const d = DRAWINGS[index];
  document.getElementById('owner').textContent = d.mine ? 'Ny övning från Playbot' : 'Er ritning';
  setCamera(camMode, false);
  render(0, true);
}

// The part of the field the drawing uses – the camera frames that, not the whole pitch.
let frame;
function computeFrame() {
  const box = new THREE.Box3();
  for (const p of current.drawing.diagram.pieces) box.expandByPoint(toWorld(p.x, p.y, current.field));
  for (const s of current.steps) for (const m of Object.values(s.moves)) for (const q of m.curve.getSpacedPoints(6)) box.expandByPoint(q);
  // A small drill still gets some room around it.
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  box.expandByVector(new THREE.Vector3(Math.max(0, 14 - size.x) / 2 + 1.5, 0, Math.max(0, 10 - size.z) / 2 + 1.5));
  return { c, box, w: Math.max(size.x, 12), d: Math.max(size.z, 10) };
}

// ───────────────────────────────────────────────────────────── cameras
let camMode = 'tv';
const camFrom = new THREE.Vector3(), camTo = new THREE.Vector3(), tgtFrom = new THREE.Vector3(), tgtTo = new THREE.Vector3();
let camT = 1;

// The part of the screen not covered by the top bar and the caption/controls (in NDC, -1…1).
function visibleBand() {
  const H = window.innerHeight || 1;
  const top = document.querySelector('.owner').getBoundingClientRect().bottom + 8;
  const bottom = document.querySelector('.caption').getBoundingClientRect().top - 8;
  return { top: 1 - (2 * top) / H, bottom: 1 - (2 * bottom) / H };
}
const probe = new THREE.PerspectiveCamera();
// Puts the camera at azimuth az / elevation el so the whole drill fits between the menus, as close as possible.
function fitPose(az, el) {
  const { box } = frame;
  const pts = [];
  for (const x of [box.min.x, box.max.x]) for (const z of [box.min.z, box.max.z]) for (const y of [0, 2.2]) pts.push(new THREE.Vector3(x, y, z));
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  probe.fov = camera.fov; probe.aspect = camera.aspect; probe.near = 0.1; probe.far = 3000; probe.updateProjectionMatrix();
  const band = visibleBand();
  const target = frame.c.clone();
  const q = new THREE.Vector3();
  const place = (D) => { probe.position.copy(target).addScaledVector(dir, D); probe.lookAt(target); probe.updateMatrixWorld(); };
  const fits = (D) => {
    place(D);
    for (const p of pts) {
      q.copy(p).project(probe);
      if (q.z > 1 || q.x < -0.94 || q.x > 0.94 || q.y > band.top || q.y < band.bottom) return false;
    }
    return true;
  };
  let D = 0;
  for (let pass = 0; pass < 3; pass++) {
    let lo = 2, hi = 900;
    for (let i = 0; i < 32; i++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
    D = hi;
    // Centre the drill in the free band: slide camera and target along the screen's up direction.
    place(D);
    let minY = Infinity, maxY = -Infinity;
    for (const p of pts) { q.copy(p).project(probe); minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y); }
    const shift = ((band.top + band.bottom) / 2 - (minY + maxY) / 2) * D * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(probe.quaternion);
    if (Math.abs(el) > 1.4) target.addScaledVector(up, -shift); // looking straight down: slide over the ground
    else target.addScaledVector(new THREE.Vector3(up.x, 0, up.z).normalize(), -shift / Math.max(0.35, Math.sin(el)));
  }
  place(D);
  return { pos: probe.position.clone(), tgt: target.clone() };
}

function camPose(mode) {
  const portrait = camera.aspect < 1;
  if (mode === 'top') return fitPose(portrait ? Math.PI / 2 : 0, Math.PI / 2 - 0.0015);
  if (mode === 'goal') return fitPose(Math.PI / 2, 0.42);
  // TV: from the main stand; on a phone held upright, a little from the side so the pitch fills the screen.
  return fitPose(portrait ? 0.62 : 0, portrait ? 0.62 : 0.5);
}

function setCamera(mode, animate = true) {
  camMode = mode;
  document.querySelectorAll('.cams button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cam === mode)));
  if (mode === 'follow') { camT = 1; return; }
  const pose = camPose(mode);
  if (!animate || reduceMotion) {
    camera.position.copy(pose.pos); controls.target.copy(pose.tgt); camT = 1; controls.update(); return;
  }
  camFrom.copy(camera.position); tgtFrom.copy(controls.target);
  camTo.copy(pose.pos); tgtTo.copy(pose.tgt); camT = 0;
}

controls.addEventListener('start', () => {
  if (camMode !== 'free') { camMode = 'free'; camT = 1; document.querySelectorAll('.cams button').forEach((b) => b.setAttribute('aria-pressed', 'false')); }
  hideHint();
});

// ───────────────────────────────────────────────────────────── per-frame update
const tmp = new THREE.Vector3();
function render(dt, jump = false) {
  const snap = snapshot(current, t);
  const ballPos = ballIds.length ? snap.at[ballIds[0]] : null;
  for (const [id, th] of Object.entries(things)) {
    const p = snap.at[id];
    if (!p) continue;
    if (th.kind === 'ball') {
      const prev = th.root.position.clone().setY(0);
      th.root.position.set(p.x, th.r + (snap.lofts[id] || 0), p.z);
      const mv = new THREE.Vector3(p.x - prev.x, 0, p.z - prev.z);
      const dist = mv.length();
      if (!jump && dist > 1e-4 && dist < 8) {
        const axis = new THREE.Vector3(mv.z, 0, -mv.x).normalize();
        th.root.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, dist / th.r));
      }
    } else if (th.kind === 'player') {
      const prev = th.last || p.clone();
      const vel = tmp.set(p.x - prev.x, 0, p.z - prev.z);
      const speedMs = jump || dt <= 0 ? 0 : vel.length() / dt;
      th.last = p.clone();
      th.root.position.set(p.x, 0, p.z);
      // Facing: where they run, otherwise towards the ball.
      let targetYaw = th.yaw;
      if (speedMs > 0.4) targetYaw = Math.atan2(vel.x, vel.z);
      else if (ballPos) { const dx = ballPos.x - p.x, dz = ballPos.z - p.z; if (dx * dx + dz * dz > 0.6) targetYaw = Math.atan2(dx, dz); }
      let dy = targetYaw - th.yaw;
      dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      th.yaw += jump ? dy : dy * Math.min(1, dt * 7);
      th.root.rotation.y = th.yaw;
      // Running: legs and arms swing with the pace, a small bounce in the stride.
      const amp = Math.min(speedMs / 5, 1);
      th.phase += dt * (4 + speedMs * 1.5);
      const sw = Math.sin(th.phase) * 0.75 * amp;
      th.legs[0].rotation.x = sw; th.legs[1].rotation.x = -sw;
      th.arms[0].rotation.x = -sw * 0.8; th.arms[1].rotation.x = sw * 0.8;
      th.body.position.y = Math.abs(Math.sin(th.phase)) * 0.05 * amp + Math.sin(th.phase * 0.35) * 0.006;
      th.body.rotation.x = 0.12 * amp;
      // Number badge above the head, readable from any distance.
      th.badge.position.set(p.x, 2.12 * th.scale, p.z);
      const dcam = camera.position.distanceTo(th.badge.position);
      th.badge.scale.setScalar(THREE.MathUtils.clamp(dcam * 0.03, 0.55, 2.8));
      th.badge.material.opacity = THREE.MathUtils.clamp((dcam - 6) / 8, 0, 1); // up close you see the shirt instead
    } else {
      th.root.position.set(p.x, 0, p.z);
    }
  }
  // Paths: the step playing now (or about to play) shows its runs and passes.
  const showIdx = snap.active >= 0 ? snap.active : 0;
  const nextIdx = current.steps.findIndex((s) => t < s.start);
  const idx = snap.active >= 0 && t <= current.steps[snap.active].end ? snap.active : nextIdx >= 0 ? nextIdx : showIdx;
  paths.forEach((g, i) => (g.visible = i === idx));
  updateCaption(snap, idx);
}

let lastCaption = '';
let lastScrub = -1;
function updateCaption(snap, idx) {
  const n = current.steps.length;
  const started = current.steps.length && t >= current.steps[0].start;
  const ended = n && t > current.steps[n - 1].end + 0.2;
  let no, note;
  if (!n) { no = '–'; note = current.drawing.diagram.note || current.drawing.name; }
  else if (!started) { no = 'Start'; note = current.drawing.diagram.note || current.drawing.name; }
  else if (ended) { no = 'Klart'; note = 'Spelas igen om en stund – eller välj en annan övning.'; }
  else { no = `${idx + 1}/${n}`; note = current.steps[idx]?.note || ''; }
  const key = no + note;
  if (key !== lastCaption) {
    lastCaption = key;
    document.getElementById('stepNo').textContent = no;
    document.getElementById('note').textContent = note || ' ';
  }
  const v = Math.round((t / current.total) * 1000);
  if (v !== lastScrub) {
    lastScrub = v;
    const scrub = document.getElementById('scrub');
    if (!scrubbing) scrub.value = String(v);
    scrub.style.setProperty('--p', v / 10 + '%');
  }
}

function buildTicks() {
  const el = document.getElementById('ticks');
  el.innerHTML = '';
  for (const s of current.steps) {
    const i = document.createElement('i');
    i.style.left = (s.start / current.total) * 100 + '%';
    el.appendChild(i);
  }
}

// ───────────────────────────────────────────────────────────── loop
let lastTime = performance.now();
let scrubbing = false;
let frames = 0, sampleStart = 0, degraded = 0;
function adapt(now) {
  // After the first couple of seconds: too slow? Step down once or twice (sharpness first, then shadows).
  if (!sampleStart) { sampleStart = now; frames = 0; return; }
  frames++;
  if (now - sampleStart < 2500) return;
  const fps = (frames * 1000) / (now - sampleStart);
  sampleStart = now; frames = 0;
  if (fps < 40 && degraded === 0) { degraded = 1; renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25)); }
  else if (fps < 30 && degraded === 1) {
    degraded = 2;
    renderer.setPixelRatio(1);
    renderer.shadowMap.type = THREE.PCFShadowMap;
    key.shadow.map?.dispose(); key.shadow.map = null; key.shadow.mapSize.set(1024, 1024);
  }
}
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (degraded < 2) adapt(now);
  if (playing && !scrubbing) {
    t += dt * speed;
    if (t > current.total) t = 0;
  }
  render(dt);
  if (camT < 1) {
    camT = Math.min(1, camT + dt / 0.9);
    const k = camT < 0.5 ? 4 * camT ** 3 : 1 - (-2 * camT + 2) ** 3 / 2;
    camera.position.lerpVectors(camFrom, camTo, k);
    controls.target.lerpVectors(tgtFrom, tgtTo, k);
  } else if (camMode === 'follow' && ballIds.length) {
    const b = things[ballIds[0]].root.position;
    const want = tmp.set(b.x, 0, b.z);
    controls.target.lerp(want, Math.min(1, dt * 3));
    const az = camera.aspect < 1 ? 0.62 : 0;
    const desired = new THREE.Vector3(b.x + Math.sin(az) * 15, 10, b.z + Math.cos(az) * 15);
    camera.position.lerp(desired, Math.min(1, dt * 2));
  }
  controls.update();
  renderer.render(scene, camera);
  if (!window.__ready) {
    window.__ready = true;
    const l = document.getElementById('loading');
    l.classList.add('gone');
    setTimeout(() => (l.hidden = true), 700);
  }
  requestAnimationFrame(loop);
}

// ───────────────────────────────────────────────────────────── UI
const pick = document.getElementById('pick');
DRAWINGS.forEach((d, i) => {
  const o = document.createElement('option');
  o.value = String(i);
  o.textContent = d.name;
  pick.appendChild(o);
});
pick.addEventListener('change', () => { load(Number(pick.value)); setPlaying(!reduceMotion); });

const playBtn = document.getElementById('play');
function setPlaying(v) {
  playing = v;
  playBtn.setAttribute('aria-label', v ? 'Pausa' : 'Spela');
  document.getElementById('playIcon').innerHTML = v ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
}
playBtn.addEventListener('click', () => { if (!playing && t >= current.total - 0.05) t = 0; setPlaying(!playing); hideHint(); });
function jumpStep(dir) {
  const starts = [0, ...current.steps.map((s) => s.start)];
  const cur = starts.filter((s) => s <= t + 0.01).length - 1;
  const nextI = Math.max(0, Math.min(starts.length - 1, cur + dir));
  t = dir < 0 && t - starts[cur] > 0.6 ? starts[cur] : starts[nextI];
  for (const th of Object.values(things)) th.last = null;
  render(0, true);
}
document.getElementById('prev').addEventListener('click', () => { setPlaying(false); jumpStep(-1); });
document.getElementById('next').addEventListener('click', () => { setPlaying(false); jumpStep(1); });
const speeds = [1, 1.5, 0.5];
document.getElementById('speed').addEventListener('click', (e) => {
  speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
  e.currentTarget.textContent = String(speed).replace('.', ',') + '×';
});
document.querySelectorAll('.cams button').forEach((b) => b.addEventListener('click', () => setCamera(b.dataset.cam)));
const scrub = document.getElementById('scrub');
scrub.addEventListener('input', () => {
  scrubbing = true;
  t = (Number(scrub.value) / 1000) * current.total;
  for (const th of Object.values(things)) th.last = null;
  render(0, true);
});
const endScrub = () => { scrubbing = false; };
scrub.addEventListener('change', endScrub);
scrub.addEventListener('pointerup', endScrub);
scrub.addEventListener('touchend', endScrub);

let hintTimer = setTimeout(hideHint, 5000);
function hideHint() { clearTimeout(hintTimer); document.getElementById('hint').classList.add('gone'); }

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (camMode !== 'free' && camMode !== 'follow') setCamera(camMode, false);
});
// Back from another app or tab: don't count the pause as a slow device.
document.addEventListener('visibilitychange', () => { lastTime = performance.now(); sampleStart = 0; });

// Start with the team's own "3 mot 2" (the first drawing) once the broadcast font is in (max 1.5 s).
setPlaying(playing);
// Local testing only: a handle for checking camera and pieces from the console.
if (location.hostname === 'localhost') window.__dbg = { camera, controls, things: () => things, THREE, setT: (v) => { t = v; }, pause: () => setPlaying(false) };
Promise.race([document.fonts?.ready ?? Promise.resolve(), new Promise((r) => setTimeout(r, 1500))])
  .catch(() => {})
  .then(() => {
    load(0);
    requestAnimationFrame(loop);
  });
</script>
</body>
</html>
