<body>
<!-- A standalone test of a new drawing tool. It does not replace the drawing tool inside Playbook (owner decision 2026-10-02). -->
<title>Taktiktavlan</title>
<style>
/* Layout: one-screen tool — controls stacked at the top (thumb-safe on iPhone), the pitch fills the rest. */
:root {
  --bg: #F3F6F9;
  --surface: #FFFFFF;
  --surface-alt: #EEF2F6;
  --text: #172033;
  --muted: #667085;
  --line: #D8DEE7;
  --primary: #154C79;
  --primary-soft: #EDF5FB;
  --on-primary: #FFFFFF;
  --accent: #C2410C;
  --danger: #B42318;
  --team: #1F5FAE;
  --opp: #D23B3B;
  --keeper: #F2C14E;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C121C; --surface: #141C29; --surface-alt: #1B2535; --text: #E9EEF5; --muted: #A0ABBD;
    --line: #263247; --primary: #5B9BD5; --primary-soft: #16273D; --on-primary: #0C121C; --accent: #FB923C;
    --danger: #F97066; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C121C; --surface: #141C29; --surface-alt: #1B2535; --text: #E9EEF5; --muted: #A0ABBD;
  --line: #263247; --primary: #5B9BD5; --primary-soft: #16273D; --on-primary: #0C121C; --accent: #FB923C;
  --danger: #F97066; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; padding-inline: 12px; box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* Header */
.head { display: flex; align-items: center; gap: 8px; padding-block: 10px 6px; }
.name { flex: 1; min-width: 0; font: 800 18px/1.2 var(--font); color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 6px 8px; text-overflow: ellipsis; }
.name:hover { border-color: var(--line); }
.name:focus { border-color: var(--primary); background: var(--surface); outline: none; }
.ghost { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; }
.ghost:disabled { opacity: .45; cursor: default; }
.ghost svg { width: 16px; height: 16px; }
.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* Rows */
.row { display: flex; align-items: center; gap: 8px; padding-block: 4px; }
.scroll { overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding-block: 2px; touch-action: pan-x; }
.scroll::-webkit-scrollbar { display: none; }
.step { flex: none; min-width: 36px; height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.step[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.step.add { border-style: dashed; border-color: var(--primary); color: var(--primary); }
.icon-btn { flex: none; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn svg { width: 18px; height: 18px; }

/* Tray of draggable pieces */
.tray .item { flex: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; touch-action: pan-x; }
.tray .item canvas { width: 24px; height: 24px; pointer-events: none; }
.tray .item:active { transform: scale(.97); }

.note { width: 100%; box-sizing: border-box; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0 12px; font: 14px var(--font); -webkit-user-select: text; user-select: text; }
.note::placeholder { color: var(--muted); }

/* Stage */
.stage { position: relative; flex: 1; min-height: 240px; margin-block: 6px 14px; }
canvas#pitch { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.tip { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(92%, 420px); box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: flex; gap: 10px; align-items: flex-start; }
.tip b { color: var(--primary); }
.tip button { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
.caption { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: 92%; background: rgba(12,18,28,.78); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; text-align: center; pointer-events: none; }
.caption .k { color: #FFC879; font-variant-numeric: tabular-nums; margin-right: 6px; }

/* Selection bubble */
.bubble { position: absolute; z-index: 5; display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.22); }
.bubble button { height: 34px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; font-size: 13px; white-space: nowrap; }
.bubble button:hover { background: var(--surface-alt); }
.bubble .del { color: var(--danger); }
.bubble input { width: 46px; height: 34px; box-sizing: border-box; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-alt); color: var(--text); text-align: center; font: 800 15px var(--font); -webkit-user-select: text; user-select: text; }

/* Playback bar */
.range { flex: 1; min-width: 80px; accent-color: var(--primary); }
.chip { flex: none; height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.label { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Sheets */
.sheet-back { position: fixed; inset: 0; background: rgba(8,12,20,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(100%, 560px); max-height: 82%; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
.sheet h2 { margin: 2px 0 4px; font-size: 18px; }
.sheet p.sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.card canvas { width: 100%; aspect-ratio: 105 / 68; border-radius: 8px; display: block; }
.card b { font-size: 14px; }
.card span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list .li { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; }
.list .li .t { flex: 1; min-width: 0; }
.list .li .t b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .li .t span { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 14px 4px; }

.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.ghost-drag { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%); }
@media (prefers-reduced-motion: reduce) { .tray .item:active { transform: none; } }
</style>

<div class="app" id="app">
  <div class="head">
    <input class="name" id="name" aria-label="Övningens namn" maxlength="60">
    <button class="ghost" id="btnTemplates" aria-label="Färdiga upplägg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Upplägg</button>
    <button class="ghost" id="btnSaved" aria-label="Mina övningar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Mina</button>
  </div>

  <!-- Edit controls -->
  <div id="editBar">
    <div class="row">
      <div class="scroll" id="steps" role="toolbar" aria-label="Steg"></div>
      <button class="icon-btn" id="btnUndo" aria-label="Ångra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button>
      <button class="icon-btn" id="btnRedo" aria-label="Gör om"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h2"/></svg></button>
      <button class="ghost primary" id="btnPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>Spela</button>
    </div>
    <div class="row"><div class="scroll tray" id="tray" aria-label="Dra ut till planen"></div></div>
    <div class="row"><input class="note" id="note" maxlength="140" aria-label="Anteckning för steget"></div>
  </div>

  <!-- Playback controls -->
  <div id="playBar" hidden>
    <div class="row">
      <button class="icon-btn" id="btnPause" aria-label="Pausa"></button>
      <input class="range" id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Tid">
      <button class="chip" id="btnSpeed" aria-label="Hastighet">1×</button>
      <button class="chip" id="btnLoop" aria-pressed="true" aria-label="Upprepa">Upprepa</button>
      <button class="ghost" id="btnEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Rita</button>
    </div>
    <div class="row">
      <span class="label">Följ</span>
      <div class="scroll" id="follow"></div>
      <button class="ghost" id="btnExport" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Spara</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="pitch" aria-label="Taktiktavla"></canvas>
    <div class="tip" id="tip" hidden>
      <div><b>Så här:</b> dra ut spelare från raden ovanför. Tryck <b>+</b> för ett nytt steg och flytta spelare och boll dit de ska – tavlan ritar pilarna själv. Tryck <b>Spela</b> för att se övningen.</div>
      <button id="tipClose" aria-label="Stäng tipset">×</button>
    </div>
    <div class="caption" id="caption" hidden></div>
    <div class="bubble" id="bubble" hidden></div>
  </div>
</div>

<div class="sheet-back" id="sheetBack" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ------------------------------------------------------------------ world */
const FIELDS = {
  full: { w: 105, h: 68, label: 'Hel plan' },
  half: { w: 52.5, h: 68, label: 'Halvplan' },
  area: { w: 40, h: 30, label: 'Träningsyta' },
};
const KINDS = {
  team: { label: 'Spelare', r: 1.1 },
  opp: { label: 'Motståndare', r: 1.1 },
  keeper: { label: 'Målvakt', r: 1.1 },
  ball: { label: 'Boll', r: 0.55 },
  cone: { label: 'Kon', r: 0.6 },
  minigoal: { label: 'Litet mål', w: 3, d: 1.2 },
  goal: { label: 'Mål', w: 7.32, d: 2 },
  ladder: { label: 'Stege', w: 1, l: 5 },
  ring: { label: 'Ring', r: 0.8 },
  pole: { label: 'Docka', r: 0.6 },
  zone: { label: 'Zon', w: 12, h: 8 },
};
const TRAY = ['team', 'opp', 'keeper', 'ball', 'cone', 'minigoal', 'goal', 'zone', 'ladder', 'ring', 'pole'];
const PLAYERS = new Set(['team', 'opp', 'keeper']);
const STEP_SECONDS = 1.5;

/* ------------------------------------------------------------------ state */
let state = blank();
let current = 0;            // step being edited (0 = start position)
let selected = null;        // piece id
let undoStack = [], redoStack = [];
let mode = 'edit';          // 'edit' | 'play'
let playT = 0, playing = false, speed = 1, loop = true, followId = null, lastTs = 0;
const downloads = null; // the open web saves through the share sheet or a normal download

function blank() { return { name: 'Ny övning', field: 'area', pieces: [], steps: [] }; }
const uid = () => Math.random().toString(36).slice(2, 9);
const $ = (id) => document.getElementById(id);

function snapshot() { return JSON.stringify(state); }
function commit() { undoStack.push(snapshot()); if (undoStack.length > 80) undoStack.shift(); redoStack = []; }
function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); state = JSON.parse(undoStack.pop()); afterLoad(); }
function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); state = JSON.parse(redoStack.pop()); afterLoad(); }
function afterLoad() { current = Math.min(current, state.steps.length); selected = null; renderUI(); draw(); save(); }

/* ------------------------------------------------------------------ positions */
const piece = (id) => state.pieces.find((p) => p.id === id);
function posAt(id, k) { // position at the END of step k (k = 0 → start)
  const p = piece(id); let pos = { x: p.x, y: p.y };
  for (let i = 1; i <= k && i <= state.steps.length; i++) { const m = state.steps[i - 1].moves[id]; if (m) pos = m.pts[m.pts.length - 1]; }
  return pos;
}
function stepPath(id, k) { // polyline for step k (1-based) including its start, or null
  const s = state.steps[k - 1]; if (!s) return null; const m = s.moves[id]; if (!m) return null;
  return smooth([posAt(id, k - 1), ...m.pts]);
}
function smooth(pts) { // Catmull-Rom through the points → dense polyline with cumulative lengths
  if (pts.length < 2) return { pts, len: [0], total: 0 };
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const n = pts.length === 2 ? 1 : 8;
    for (let t = 0; t < n; t++) {
      const u = t / n, u2 = u * u, u3 = u2 * u;
      out.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * u + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3),
      });
    }
  }
  out.push(pts[pts.length - 1]);
  const len = [0];
  for (let i = 1; i < out.length; i++) len.push(len[i - 1] + Math.hypot(out[i].x - out[i - 1].x, out[i].y - out[i - 1].y));
  return { pts: out, len, total: len[len.length - 1] };
}
function along(path, f) { // point at fraction f of the path's length, plus heading
  const d = f * path.total; let i = 1;
  while (i < path.len.length - 1 && path.len[i] < d) i++;
  const a = path.pts[i - 1], b = path.pts[i]; const seg = path.len[i] - path.len[i - 1] || 1;
  const u = Math.max(0, Math.min(1, (d - path.len[i - 1]) / seg));
  return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, ang: Math.atan2(b.y - a.y, b.x - a.x) };
}
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function posAtTime(id, T) { // during playback, T in [0, steps]
  const n = state.steps.length; if (n === 0 || T <= 0) return posAt(id, 0);
  const k = Math.min(n, Math.floor(T) + 1); const f = Math.min(1, T - (k - 1));
  const path = stepPath(id, k);
  if (!path) return posAt(id, k - 1);
  return along(path, ease(f));
}
/** Who carries the ball in step k: a player whose run follows the ball's path. */
function dribbler(k) {
  const ball = state.pieces.find((p) => p.kind === 'ball' && state.steps[k - 1]?.moves[p.id]); if (!ball) return null;
  const bp = stepPath(ball.id, k);
  for (const p of state.pieces) {
    if (!PLAYERS.has(p.kind)) continue; const pp = stepPath(p.id, k); if (!pp) continue;
    let ok = true; for (const f of [0, 0.25, 0.5, 0.75, 1]) { const a = along(bp, f), b = along(pp, f); if (Math.hypot(a.x - b.x, a.y - b.y) > 2.6) { ok = false; break; } }
    if (ok) return { player: p.id, ball: ball.id };
  }
  return null;
}

/* ------------------------------------------------------------------ view */
const canvas = $('pitch'); const ctx = canvas.getContext('2d');
let view = { vertical: false, s: 10, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
function layout() {
  const r = $('stage').getBoundingClientRect(); const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const F = FIELDS[state.field]; const pad = 12;
  const vertical = r.height > r.width * 1.05;
  const ww = vertical ? F.h : F.w, wh = vertical ? F.w : F.h;
  const s = Math.min((r.width - pad * 2) / ww, (r.height - pad * 2) / wh);
  view = { vertical, s, ox: (r.width - ww * s) / 2, oy: (r.height - wh * s) / 2, w: r.width, h: r.height, dpr };
}
function toScreen(p) {
  const F = FIELDS[state.field];
  return view.vertical ? { x: view.ox + p.y * view.s, y: view.oy + (F.w - p.x) * view.s } : { x: view.ox + p.x * view.s, y: view.oy + p.y * view.s };
}
function toWorld(px, py) {
  const F = FIELDS[state.field];
  const p = view.vertical ? { x: F.w - (py - view.oy) / view.s, y: (px - view.ox) / view.s } : { x: (px - view.ox) / view.s, y: (py - view.oy) / view.s };
  return { x: Math.max(0, Math.min(F.w, p.x)), y: Math.max(0, Math.min(F.h, p.y)) };
}
function worldTransform(c, v = view, field = state.field) {
  const F = FIELDS[field]; const d = v.dpr, s = v.s;
  if (v.vertical) c.setTransform(0, -s * d, s * d, 0, v.ox * d, (v.oy + F.w * s) * d);
  else c.setTransform(s * d, 0, 0, s * d, v.ox * d, v.oy * d);
}
const screenTransform = (c, v = view) => c.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const px = (m, min) => Math.max(min, m * view.s);

/* ------------------------------------------------------------------ drawing */
function drawField(c, field, v) {
  const F = FIELDS[field];
  worldTransform(c, v, field);
  // grass with mowing stripes
  const stripes = field === 'area' ? 8 : 12;
  for (let i = 0; i < stripes; i++) { c.fillStyle = i % 2 ? '#2E7D4F' : '#348A57'; c.fillRect((F.w / stripes) * i, 0, F.w / stripes + 0.05, F.h); }
  const lw = 1.6 / v.s; c.strokeStyle = 'rgba(255,255,255,.88)'; c.lineWidth = lw; c.lineJoin = 'round';
  if (field === 'area') {
    c.setLineDash([1.2, 0.9]); c.strokeRect(1, 1, F.w - 2, F.h - 2); c.setLineDash([]);
    return;
  }
  const full = field === 'full';
  const L = full ? 105 : 52.5; const ox = full ? 0 : -52.5; // half pitch shows the attacking half (goal at the far end)
  c.save(); c.beginPath(); c.rect(0, 0, F.w, F.h); c.clip(); c.translate(ox, 0);
  c.strokeRect(0.5, 0.5, 104, 67);
  c.beginPath(); c.moveTo(52.5, 0.5); c.lineTo(52.5, 67.5); c.stroke();
  c.beginPath(); c.arc(52.5, 34, 9.15, 0, Math.PI * 2); c.stroke();

  const wasPlaying = playing; playing = false;
  const stream = canvas.captureStream(30); const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 5e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data); const stopped = new Promise((r) => (rec.onstop = r));
  toast('Spelar in…', 60000); rec.start(200); trails.clear();
  const n = state.steps.length; const total = n * STEP_SECONDS + 1.4; const t0 = performance.now();
  await new Promise((resolve) => {
    (function frame() {
      const el = (performance.now() - t0) / 1000; const T = Math.max(0, Math.min(n, (el - 0.6) / STEP_SECONDS));
      playT = T; recordTrails(T);
      draw(); updatePlayUI();
      if (el < total) requestAnimationFrame(frame); else resolve();
    })();
  });
  rec.stop(); await stopped; hideToast();
  const blob = new Blob(chunks, { type }); playing = wasPlaying;
  await offer(`${slug(state.name)}.${type.includes('mp4') ? 'mp4' : 'webm'}`, blob);
}

/* ------------------------------------------------------------------ toast & tip */
let toastTimer = 0;
function toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms); }
function hideToast() { $('toast').hidden = true; }
function hideTip() { $('tip').hidden = true; store.set('taktiktavlan.tipSeen', true); }
$('tipClose').addEventListener('click', hideTip);

/* ------------------------------------------------------------------ start */
(function start() {
  const saved = store.get(KEY);
  state = saved && saved.pieces ? saved : TEMPLATES[0].make();
  buildTray(); layout(); renderUI(); draw();
  if (!store.get('taktiktavlan.tipSeen')) $('tip').hidden = false;
  new ResizeObserver(() => { layout(); draw(); if (!$('bubble').hidden && selected) showBubble(selected); }).observe($('stage'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { buildTray(); draw(); });
  $('btnExport').hidden = false;
})();
</script>
