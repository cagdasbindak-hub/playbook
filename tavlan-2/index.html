<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:description" content="Förslag från Playbot: spela in som i ett spel, riktiga passningar och utmaningar för spelarna.">

<title>Tavlan 2.0</title>

<!--
  A proposal from Playbot (2026-11-11): the tactics board as a game. Standalone – the app is unchanged.
  Three modes on one pitch: Skapa (record by playing, real passes), Titta (broadcast playback) and
  Utmaning (the play stops at each decision and the players answer). Everything stays in this browser.
-->
<style>
:root {
  --ink: #0B1622;
  --glass: rgba(14, 27, 43, 0.82);
  --glass-strong: rgba(9, 18, 29, 0.94);
  --line: rgba(255, 255, 255, 0.12);
  --text: #F3F7FB;
  --muted: #9FB2C6;
  --accent: #5AA9F0;
  --accent-ink: #06121F;
  --home: #2F74D0;
  --away: #D8434A;
  --gold: #F2C14E;
  --ok: #3DDC84;
  --bad: #FF5A5F;
  --display: "Barlow Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: radial-gradient(120% 70% at 50% 0%, #163250 0%, #0B1622 55%, #060C14 100%) fixed;
  color: var(--text);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app {
  height: 100vh; height: 100dvh;
  max-width: 560px; margin: 0 auto;
  display: grid; grid-template-rows: auto auto 1fr auto;
  position: relative;
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 6px; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.logo { flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(145deg, #3B86E0, #154C79); font-family: var(--display); font-weight: 800; font-size: 21px;
  box-shadow: 0 6px 18px rgba(47, 116, 208, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.brand b { display: block; font-family: var(--display); font-size: 22px; line-height: 1; letter-spacing: 0.02em; }
.brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 17px;
  background: rgba(242, 193, 78, 0.14); border: 1px solid rgba(242, 193, 78, 0.45); color: #FFE3A0; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(242, 193, 78, 0.7); animation: ping 1.8s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(242, 193, 78, 0.6); } 80%, 100% { box-shadow: 0 0 0 8px rgba(242, 193, 78, 0); } }
.iconbtn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); }
.iconbtn svg { width: 20px; height: 20px; }

/* Mode switch */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 4px 16px 8px; padding: 4px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 15px; }
.modes button { height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
  transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
.modes button svg { width: 17px; height: 17px; }
.modes button[aria-selected="true"] { color: #fff; background: linear-gradient(180deg, #3B86E0, #2259AA);
  box-shadow: 0 6px 16px rgba(47, 116, 208, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
.modes button[data-mode="challenge"][aria-selected="true"] { background: linear-gradient(180deg, #F5CB5C, #D99A1E); color: #2A1C00;
  box-shadow: 0 6px 16px rgba(242, 193, 78, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4); }

/* Stage */
.stage { position: relative; overflow: hidden; min-height: 0; border-radius: 18px; margin: 0 8px; background: #0A1420;
  box-shadow: 0 0 0 1px var(--line); transition: box-shadow 0.25s; }
.stage.rec { box-shadow: 0 0 0 3px rgba(255, 90, 95, 0.9), 0 0 30px rgba(255, 90, 95, 0.35); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
.scoreboard { display: flex; align-items: stretch; height: 26px; border-radius: 7px; overflow: hidden; font-family: var(--display); font-weight: 700;
  font-size: 15px; letter-spacing: 0.05em; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); }
.scoreboard span { display: flex; align-items: center; padding: 0 8px; }
.scoreboard .h { background: var(--home); }
.scoreboard .a { background: var(--away); }
.scoreboard .n { background: #F3F7FB; color: #0B1622; font-variant-numeric: tabular-nums; padding: 0 9px; }
.scoreboard .n.flash { animation: flash 0.9s 2; }
@keyframes flash { 50% { background: var(--gold); } }
.scoreboard .clock { background: rgba(9, 18, 29, 0.88); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 62px; justify-content: center; }
.recb { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 7px; background: rgba(224, 56, 62, 0.92);
  font-family: var(--display); font-weight: 800; letter-spacing: 0.1em; font-size: 15px; box-shadow: 0 6px 18px rgba(224, 56, 62, 0.35); }
.recb i { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.15; } }
.xp { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 7px; background: rgba(9, 18, 29, 0.88);
  border: 1px solid rgba(242, 193, 78, 0.5); font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: 0.04em; color: #FFE3A0; }
.xp .streak { color: #FF9F43; }
.xp.bump { animation: bump 0.45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { 40% { transform: scale(1.18); } }

.qcard { position: absolute; left: 10px; right: 10px; top: 44px; padding: 12px 14px 14px; border-radius: 16px; background: var(--glass-strong);
  border: 1px solid rgba(242, 193, 78, 0.5); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5); opacity: 0; transform: translateY(-14px) scale(0.97);
  transition: opacity 0.25s, transform 0.35s cubic-bezier(.2, 1.3, .4, 1), border-color 0.2s; pointer-events: none; }
.qcard.show { opacity: 1; transform: none; pointer-events: auto; }
.qcard.ok { border-color: var(--ok); }
.qcard.bad { border-color: var(--bad); animation: shake 0.4s; }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
.qcard .kick { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 0.12em; color: var(--gold); }
.qcard.ok .kick { color: var(--ok); }
.qcard.bad .kick { color: var(--bad); }
.qcard .qt { margin-top: 2px; padding-right: 44px; font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.08; }
.qcard .sub { margin-top: 4px; color: var(--muted); font-size: 14px; font-weight: 600; }
.qcard .timer { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--gold) calc(var(--p, 1) * 360deg), rgba(255, 255, 255, 0.12) 0); }
.qcard .timer b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #0B1622;
  font-family: var(--display); font-size: 16px; font-variant-numeric: tabular-nums; }
.qcard .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.qcard .choices button { height: 48px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
  font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: 0.03em; }
.qcard .choices button:active { transform: scale(0.97); }
.qcard .choices button.right { background: rgba(61, 220, 132, 0.2); border-color: var(--ok); }
.qcard .choices button.wrong { background: rgba(255, 90, 95, 0.2); border-color: var(--bad); }

.caption { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; border-radius: 12px; overflow: hidden; background: var(--glass-strong);
  border: 1px solid var(--line); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45); opacity: 0; transform: translateY(16px);
  transition: opacity 0.3s, transform 0.4s cubic-bezier(.2, 1, .3, 1); pointer-events: none; }
.caption.show { opacity: 1; transform: none; }
.caption .bar { flex: none; width: 5px; background: var(--accent); }
.caption .in { padding: 9px 12px 10px; }
.caption small { display: block; font-family: var(--display); font-weight: 800; font-size: 12.5px; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; }
.caption p { font-size: 15.5px; font-weight: 600; line-height: 1.3; }

.big { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0;
  font-family: var(--display); font-weight: 800; font-size: clamp(70px, 24vw, 130px); letter-spacing: 0.02em; line-height: 1;
  color: #FFE7A8; text-shadow: 0 5px 0 #8A5A00, 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 60px rgba(242, 193, 78, 0.55); }
.big.show { animation: big 1.7s cubic-bezier(.2, .9, .2, 1) forwards; }
.big.count { color: #fff; text-shadow: 0 5px 0 rgba(0, 0, 0, 0.35), 0 0 50px rgba(255, 90, 95, 0.6); }
.big.count.show { animation: count 0.9s cubic-bezier(.2, .9, .2, 1) forwards; }
@keyframes big { 0% { opacity: 0; transform: scale(2.4) rotate(-8deg); } 16% { opacity: 1; transform: scale(0.9) rotate(-4deg); }
  26% { transform: scale(1.05) rotate(-4deg); } 75% { opacity: 1; transform: scale(1) rotate(-4deg); } 100% { opacity: 0; transform: scale(1.12) rotate(-4deg); } }
@keyframes count { 0% { opacity: 0; transform: scale(1.8); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(0.8); } }

.toast { position: absolute; left: 50%; bottom: 14px; max-width: calc(100% - 28px); transform: translate(-50%, 12px); opacity: 0;
  padding: 9px 14px; border-radius: 12px; background: rgba(243, 247, 251, 0.96); color: #0B1622; font-weight: 700; font-size: 14px; text-align: center;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4); transition: opacity 0.25s, transform 0.3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.card-ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(5, 10, 17, 0.55); backdrop-filter: blur(3px); }
.card { width: 100%; max-width: 380px; padding: 20px 18px 18px; border-radius: 22px; background: var(--glass-strong); border: 1px solid var(--line);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); text-align: center; animation: pop 0.45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { 0% { transform: scale(0.9); opacity: 0; } }
.card .kick { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 0.16em; color: var(--gold); }
.card h2 { margin-top: 4px; font-family: var(--display); font-size: 34px; line-height: 1; letter-spacing: 0.01em; }
.card p { margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 1.4; }
.card .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
.chip { min-width: 40px; height: 36px; padding: 0 10px; border-radius: 18px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line);
  font-family: var(--display); font-weight: 700; font-size: 17px; }
.chip[aria-pressed="true"] { background: var(--home); border-color: transparent; box-shadow: 0 4px 12px rgba(47, 116, 208, 0.45); }
.card .label { margin-top: 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; margin-top: 16px; border-radius: 16px;
  background: linear-gradient(180deg, #F5CB5C, #D99A1E); color: #2A1C00; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.06em;
  text-transform: uppercase; box-shadow: 0 10px 24px rgba(242, 193, 78, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
.cta:active { transform: translateY(1px) scale(0.99); }
.cta.blue { background: linear-gradient(180deg, #3B86E0, #2259AA); color: #fff; box-shadow: 0 10px 24px rgba(47, 116, 208, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.ghost { display: block; width: 100%; height: 44px; margin-top: 8px; border-radius: 14px; color: var(--accent); font-weight: 700; font-size: 15px; }
.stars { display: flex; justify-content: center; gap: 6px; margin: 10px 0 2px; font-size: 40px; line-height: 1; }
.stars span { filter: grayscale(1) brightness(0.45); transform: scale(0.8); transition: 0.4s cubic-bezier(.2, 1.6, .4, 1); }
.stars span.on { filter: none; transform: scale(1); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stats div { padding: 10px 4px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); }
.stats b { display: block; font-family: var(--display); font-size: 26px; line-height: 1; }
.stats small { color: var(--muted); font-size: 12px; font-weight: 600; }
.hint { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(90, 169, 240, 0.1); border: 1px solid rgba(90, 169, 240, 0.25);
  color: #CFE4F8; font-size: 13.5px; line-height: 1.35; text-align: left; }

/* Dock */
.dock { padding: 6px 0 0; }
.timeline { display: flex; align-items: center; gap: 10px; padding: 4px 16px 2px; }
.tl { position: relative; flex: 1; height: 34px; touch-action: none; cursor: pointer; }
.tl-bar, .tl-fill { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; }
.tl-bar { right: 0; background: rgba(255, 255, 255, 0.14); }
.tl-fill { background: var(--accent); }
.stage.rec + .dock .tl-fill, .dock.rec .tl-fill { background: var(--bad); }
.tl-head { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(90, 169, 240, 0.35); }
.tl-mark { position: absolute; top: 13px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #E9F1FA; box-shadow: 0 0 0 2px #0B1622; pointer-events: none; }
.tl-mark.shot { background: var(--gold); }
.tl-mark.cut { background: var(--bad); }
.tl-mark.note { top: 3px; width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); background: var(--accent); }
.tl-mark.q { top: 23px; width: 10px; height: 10px; margin-left: -5px; background: none; box-shadow: none; color: var(--gold); font: 800 10px/10px var(--display); text-align: center; }
.tl-time { min-width: 60px; text-align: right; font-family: var(--display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--muted); }
.qdots { display: flex; justify-content: center; gap: 8px; padding: 12px 16px 8px; }
.qdots i { width: 26px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); transition: background 0.3s; }
.qdots i.ok { background: var(--ok); }
.qdots i.bad { background: var(--bad); }
.qdots i.now { background: var(--gold); animation: blink 1s infinite; }
.controls { display: flex; gap: 6px; padding: 6px 12px calc(12px + env(safe-area-inset-bottom)); }
.cbtn { flex: 1 1 0; min-width: 0; height: 56px; padding: 0 2px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: var(--glass); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; font-weight: 700; white-space: nowrap; transition: transform 0.1s, background 0.2s; }
.cbtn:active { transform: scale(0.96); }
.cbtn svg { width: 22px; height: 22px; color: var(--text); }
.cbtn .sp { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 22px; color: var(--text); }
.cbtn.on { background: rgba(90, 169, 240, 0.17); border-color: rgba(90, 169, 240, 0.55); color: var(--text); }
.cbtn.primary { background: linear-gradient(180deg, #3B86E0, #2259AA); border-color: transparent; color: #fff; }
.cbtn.primary svg { color: #fff; }
.cbtn.rec { flex-grow: 1.35; background: linear-gradient(180deg, #FF6B6F, #D9343A); border-color: transparent; color: #fff; }
.cbtn.rec svg { color: #fff; }
.cbtn.gold { background: linear-gradient(180deg, #F5CB5C, #D99A1E); border-color: transparent; color: #2A1C00; }
.cbtn.gold svg { color: #2A1C00; }

/* Sheet */
.sheet-bg { position: absolute; inset: 0; background: rgba(3, 7, 12, 0.55); z-index: 20; animation: fade 0.2s; }
@keyframes fade { 0% { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 86%; overflow: auto; padding: 6px 16px calc(18px + env(safe-area-inset-bottom));
  background: #101D2D; border-top-left-radius: 22px; border-top-right-radius: 22px; border-top: 1px solid var(--line); box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.5);
  animation: up 0.32s cubic-bezier(.2, 1, .3, 1); }
@keyframes up { 0% { transform: translateY(40px); opacity: 0; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); margin: 4px auto 8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sheet-head h2 { font-family: var(--display); font-size: 26px; line-height: 1.05; }
.sheet-head .x { width: 36px; height: 36px; border-radius: 12px; background: rgba(255, 255, 255, 0.07); font-size: 16px; flex: none; }
.news { list-style: none; display: grid; gap: 10px; }
.news li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); }
.news .num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(145deg, #3B86E0, #154C79);
  font-family: var(--display); font-weight: 800; font-size: 20px; }
.news h3 { font-family: var(--display); font-size: 20px; line-height: 1.1; letter-spacing: 0.01em; }
.news p { margin-top: 3px; color: var(--muted); font-size: 14px; line-height: 1.38; }
.news .try { margin-top: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(90, 169, 240, 0.16); color: #CFE4F8; font-weight: 700; font-size: 13.5px; }
.fine { margin-top: 12px; color: var(--muted); font-size: 12.5px; line-height: 1.4; text-align: center; }
.rows { display: grid; gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 10px 12px; border-radius: 14px;
  background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); text-align: left; }
.row b { display: block; font-size: 15.5px; }
.row small { display: block; margin-top: 1px; color: var(--muted); font-size: 13px; line-height: 1.3; }
.switch { flex: none; width: 46px; height: 28px; border-radius: 14px; background: rgba(255, 255, 255, 0.16); position: relative; transition: background 0.2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.row[aria-checked="true"] .switch { background: var(--ok); }
.row[aria-checked="true"] .switch::after { transform: translateX(18px); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); }
.seg button { height: 38px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--home); color: #fff; }
.section-label { margin: 14px 2px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.field { width: 100%; padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); color: var(--text); font: 600 16px var(--body); }
textarea.field { min-height: 84px; resize: vertical; }

<script>
(() => {
'use strict';

// ------------------------------------------------------------------ basics
// The pitch: half a full-size pitch in metres, attacking upwards (goal line y = 0, halfway line y = H).
const W = 68, H = 52.5, POST0 = 30.34, POST1 = 37.66;
const BOX = { x0: 13.84, x1: 54.16, y1: 16.5 };
const HZ = 60;            // ball simulation steps per second
const CARRY = 1.25;       // metres between a player and the ball at his feet
const QTIME = 12;         // seconds to answer a question
const TEAM = { home: { name: 'Blå', a: '#5A9DF2', b: '#1C55AE', line: '#8EC1FF' }, away: { name: 'Röd', a: '#F2686E', b: '#B02D34', line: '#FF9EA2' } };

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fmt = (t) => { const s = Math.max(0, t); const m = Math.floor(s / 60); return `${String(m).padStart(2, '0')}:${(s - m * 60).toFixed(1).padStart(4, '0')}`; };
const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (_) { /* no vibration here */ } };
const store = {
  get(k, d) { try { const v = localStorage.getItem('pb.tavlan2.' + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('pb.tavlan2.' + k, JSON.stringify(v)); } catch (_) { /* private mode */ } },
};

const I = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z" fill="currentColor"/></svg>',
  rec: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="currentColor"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>',
  rewind: '<svg viewBox="0 0 24 24"><path d="M5.5 5h2.5v14H5.5zM19 5.6v12.8L9.4 12z" fill="currentColor"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7.5 6h9l4.5 13H3z"/><path d="M5 13h14"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  eye: '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/></svg>',
  soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
};

// ------------------------------------------------------------------ sound (made in the browser, no files)
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  let on = store.get('sound', true);
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    ac = new C();
    master = ac.createGain(); master.gain.value = 0.45; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ac;
  }
  function tone(f, type, dur, vol, f2, delay = 0) {
    if (!on || !init()) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, freq, q, kind, attack = 0.005, delay = 0) {
    if (!on || !init()) return;
    const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = kind; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  return {
    get on() { return on; },
    set on(v) { on = v; store.set('sound', v); if (v) init(); },
    unlock() { if (on) init(); },
    kick() { tone(150, 'sine', 0.13, 0.5, 52); noise(0.05, 0.22, 2400, 0.7, 'lowpass'); },
    whistle() { tone(2960, 'sine', 0.34, 0.1); tone(3090, 'sine', 0.34, 0.07); },
    ok() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 'triangle', 0.17, 0.2, 0, i * 0.06)); },
    bad() { tone(196, 'sawtooth', 0.24, 0.1, 128); tone(186, 'square', 0.24, 0.04, 118); },
    tick() { tone(1500, 'square', 0.035, 0.04); },
    pop() { tone(520, 'sine', 0.07, 0.14, 800); },
    ding() { tone(1318.5, 'sine', 0.4, 0.13); tone(1975.5, 'sine', 0.3, 0.05, 0, 0.03); },
    count() { tone(880, 'square', 0.09, 0.07); },
    go() { tone(1320, 'square', 0.22, 0.08); },
    goal() { noise(1.9, 0.2, 650, 0.6, 'bandpass', 0.35); noise(1.5, 0.1, 1700, 0.5, 'bandpass', 0.25, 0.1); this.whistle(); },
  };
})();

// ------------------------------------------------------------------ the example play
// "Vänd spelet och avsluta": 6 → 8, 8 drives, 11 runs in behind, 8 → 11, cutback 11 → 10, 10 scores.
// Key frames are [seconds, x, y]; the board turns them into smooth runs.
const KEYS = {
  h6: [[0, 34, 44], [1.0, 34, 43.6], [2.6, 32, 38], [4.8, 31, 34], [7.5, 30, 30]],
  h8: [[0, 22, 36], [1.3, 19.5, 38.5], [2.1, 19, 38], [3.8, 19.5, 30.5], [5.2, 21, 26]],
  h11: [[0, 8, 30], [2.5, 8, 29.6], [3.6, 7.6, 23.5], [4.8, 7, 16.5], [5.2, 7.3, 15.6], [6.4, 10, 7.5], [6.9, 10.4, 7.1]],
  h9: [[0, 34, 20], [4.3, 34, 19.5], [5.6, 32, 11], [6.6, 31, 7.5], [7.9, 32, 7]],
  h10: [[0, 38, 26], [4.6, 37.8, 25.6], [5.7, 36, 19], [6.7, 34.3, 13.2], [8.0, 34, 12.6]],
  h7: [[0, 60, 28], [4.3, 59.5, 27.5], [5.8, 52, 16], [7.0, 46, 9], [8.2, 44, 8]],
  h2: [[0, 58, 44], [2.2, 58, 43], [5.2, 58, 34], [8.4, 57, 30]],
  a8: [[0, 44, 34], [1.1, 37.5, 40.5], [2.6, 33, 37], [4.6, 30, 33], [8.4, 30, 28]],
  a6: [[0, 34, 30], [2.3, 30, 31], [3.9, 26, 29], [5.8, 29, 21], [7.6, 32, 16.5], [8.8, 33, 15]],
  a3: [[0, 14, 18], [2.8, 14.5, 20], [4.2, 12.5, 20.5], [5.4, 10, 14], [6.6, 11.5, 10], [7.9, 14, 9]],
  a4: [[0, 28, 14], [4.5, 28.5, 13.5], [5.8, 30, 9.5], [6.8, 30.2, 7.8], [8.4, 31, 7]],
  a5: [[0, 40, 14], [4.7, 39.5, 13.8], [6.4, 38, 10], [8.4, 37, 9]],
  a2: [[0, 54, 18], [4.5, 53.5, 17.5], [6.4, 48, 12], [8.4, 46, 10]],
  a1: [[0, 34, 2], [4.8, 33, 2], [6.4, 30.5, 2.2], [7.4, 31.5, 2.5], [8.2, 33.2, 1.6], [8.7, 34, 1.2]],
};

/** Smooth path through key frames; a player standing still (< 1 m) stops there and starts again from rest. */
function hermite(k, t) {
  let i = 0;
  while (i < k.length - 2 && t > k[i + 1][0]) i++;
  const a = k[i], b = k[i + 1], d = b[0] - a[0] || 1, u = clamp((t - a[0]) / d, 0, 1);
  const seg = (j) => (j >= 0 && j < k.length - 1 ? Math.hypot(k[j + 1][1] - k[j][1], k[j + 1][2] - k[j][2]) : 0);
  const tan = (j, c) => {
    if (j <= 0 || j >= k.length - 1 || seg(j - 1) < 1 || seg(j) < 1) return 0;
    return ((k[j + 1][c] - k[j - 1][c]) / (k[j + 1][0] - k[j - 1][0])) * d;
  };
  const u2 = u * u, u3 = u2 * u;
  const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
  return [1, 2].map((c) => +(h00 * a[c] + h10 * tan(i, c) + h01 * b[c] + h11 * tan(i + 1, c)).toFixed(2));
}
function resample(k) {
  const out = [], end = k[k.length - 1][0];
  for (let t = k[0][0]; t < end + 1e-6; t += 0.05) out.push([+t.toFixed(2), ...hermite(k, t)]);
  return out;
}

function demoModel() {
  const P = (id, team, num) => ({ id, team, num, x: KEYS[id][0][1], y: KEYS[id][0][2] });
  const pieces = [P('h6', 'home', 6), P('h8', 'home', 8), P('h10', 'home', 10), P('h7', 'home', 7), P('h11', 'home', 11), P('h9', 'home', 9), P('h2', 'home', 2),
    P('a1', 'away', 1), P('a4', 'away', 4), P('a5', 'away', 5), P('a2', 'away', 2), P('a3', 'away', 3), P('a6', 'away', 6), P('a8', 'away', 8)];
  const tracks = {};
  for (const [id, k] of Object.entries(KEYS)) tracks[id] = resample(k);
  return {
    v: 1, pieces, tracks, holder0: 'h6', ballStart: { x: 34, y: 42.4 },
    events: [
      { t0: 1.0, from: 'h6', to: 'h8', kind: 'pass' },
      { t0: 3.8, from: 'h8', to: 'h11', kind: 'pass' },
      { t0: 6.5, from: 'h11', to: 'h10', kind: 'pass' },
      { t0: 8.3, from: 'h10', to: null, tx: 36.4, ty: -0.7, kind: 'shot' },
    ],
    markers: [
      { t: 0.15, text: 'Lugnt uppspel. 6:an letar efter den fria spelaren.' },
      { t: 2.7, text: '8:an driver upp bollen – 11:an startar löpningen bakom backen.' },
      { t: 6.2, text: 'Inlägg eller cutback? Titta var det är fritt.' },
      { t: 8.95, text: 'Mål! Cutback till straffpunkten – precis som vi tränat.' },
    ],
  };
}

// ------------------------------------------------------------------ model state
let M = loadModel();
let byId = {};
let sim = null;
let questions = [];
const undoStack = [];

function loadModel() {
  const m = store.get('model', null);
  if (m && m.v === 1 && Array.isArray(m.pieces) && m.tracks && Array.isArray(m.events)) return m;
  return demoModel();
}
let saveTimer = 0;
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('model', M), 300); }
function pushUndo() { undoStack.push(JSON.stringify(M)); if (undoStack.length > 40) undoStack.shift(); }
function undo() {
  const s = undoStack.pop();
  if (!s) return toast('Inget att ångra');
  M = JSON.parse(s); dirty(); toast('Ångrat'); sfx.pop();
}
function dirty() {
  byId = Object.fromEntries(M.pieces.map((p) => [p.id, p]));
  sim = simulate();
  questions = buildQuestions();
  T = clamp(T, 0, sim.dur);
  renderTimeline();
  persist();
}

function posAt(id, t) {
  const p = byId[id], tr = M.tracks[id];
  if (!tr || !tr.length || t < tr[0][0]) return { x: p.x, y: p.y };
  const n = tr.length - 1;
  if (t >= tr[n][0]) return { x: tr[n][1], y: tr[n][2] };
  let lo = 0, hi = n;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tr[m][0] <= t) lo = m; else hi = m; }
  const a = tr[lo], b = tr[hi], u = (t - a[0]) / (b[0] - a[0] || 1);
  return { x: a[1] + (b[1] - a[1]) * u, y: a[2] + (b[2] - a[2]) * u };
}
function velAt(id, t) {
  const dt = Math.min(0.12, t) || 0.12;
  const a = posAt(id, t - dt), b = posAt(id, t);
  return { x: (b.x - a.x) / dt, y: (b.y - a.y) / dt };
}
const speedOver = (id, t0, t1) => dist(posAt(id, Math.max(0, t0)), posAt(id, t1)) / Math.max(0.05, t1 - Math.max(0, t0));
const teamOf = (id) => byId[id] && byId[id].team;
const numLabel = (id) => `${byId[id].num}:an`;

function duration() {
  let d = 3;
  for (const id in M.tracks) { const tr = M.tracks[id]; if (tr && tr.length) d = Math.max(d, tr[tr.length - 1][0] + 0.8); }
  for (const e of M.events) d = Math.max(d, e.t0 + 2);
  for (const m of M.markers) d = Math.max(d, m.t + 1.4);
  return Math.min(d, 60);
}

/**
 * The ball, worked out from who has it and the passes: at a player's feet, in the air on a pass (a long one is
 * lifted), cut out by an opponent standing in a low pass's way, picked up when free, and a goal on a shot inside
 * the posts. A pass "to" a player goes to where he will be when it arrives.
 */
function simulate() {
  const dur = Math.max(duration(), rec.on ? T + 1.5 : 0);
  const N = Math.ceil(dur * HZ) + 2;
  const evs = M.events.slice().sort((a, b) => a.t0 - b.t0);
  const out = { dur, fx: new Float32Array(N), fy: new Float32Array(N), fh: new Float32Array(N), holder: new Array(N), goals: [], cuts: [], flights: [] };
  let ei = 0, holder = M.holder0 && byId[M.holder0] ? M.holder0 : null, fl = null, lastPasser = null, block = 0, dead = false;
  let dir = { x: 0, y: holder && teamOf(holder) === 'away' ? 1 : -1 };
  let b = holder ? (() => { const p = posAt(holder, 0); return { x: p.x + dir.x * CARRY, y: p.y + dir.y * CARRY }; })() : { x: M.ballStart.x, y: M.ballStart.y };
  let h = 0;
  for (let i = 0; i < N; i++) {
    const t = i / HZ;
    while (ei < evs.length && evs[ei].t0 <= t + 1e-6) {
      const e = evs[ei++];
      if (fl || dead || !holder || holder !== e.from) continue;
      const from = { x: b.x, y: b.y };
      let to = e.to && byId[e.to] ? posAt(e.to, e.t0 + 0.6) : { x: e.tx, y: e.ty };
      const lofted = e.kind === 'pass' && dist(from, to) > 26;
      const spd = e.kind === 'shot' ? 27 : lofted ? 19 : 16.5;
      let d = Math.max(0.3, dist(from, to) / spd);
      if (e.to && byId[e.to]) for (let k = 0; k < 4; k++) { to = posAt(e.to, e.t0 + d); d = Math.max(0.3, dist(from, to) / spd); }
      fl = { e, from, to, t0: e.t0, d, lofted, hmax: e.kind === 'shot' ? 1.1 : lofted ? Math.min(7, dist(from, to) * 0.15) : 0, team: teamOf(e.from) };
      out.flights.push(fl);
      lastPasser = holder; holder = null; block = t + 0.4;
    }
    if (fl) {
      const u = clamp((t - fl.t0) / fl.d, 0, 1);

/**
 * The questions write themselves from what the coach played: every pass by the blue team ("Vem ska 8:an passa?"),

  const qs = [];

    const e = fl.e;

function drawPaths() {
  const from = T;

  for (const p of M.pieces) {

    const end = tr[tr.length - 1][0];

    const pts = [];

/** Passing lanes from whoever has the ball: green when free, red when an opponent stands in the way. */
function drawLanes() {
  const hd = holderAt(T);

  const b = ballAt(T), team = teamOf(hd);
  const opp = M.pieces.filter((p) => p.team !== team).map((p) => posAt(p.id, T));
  ctx.save(); ctx.lineCap = 'round';
  for (const p of M.pieces) {
    if (p.team !== team || p.id === hd) continue;
    const q = posAt(p.id, T);
    const d = dist(b, q);

    let block = null;

      const u = clamp(((o.x - b.x) * vx + (o.y - b.y) * vy) / L, 0, 1);

/** Who owns the space: every 2 m square goes to the nearest player's team. Also counts the share. */

  const pos = M.pieces.map((p) => ({ team: p.team, ...posAt(p.id, T) }));

// ------------------------------------------------------------------ effects

// ------------------------------------------------------------------ input on the pitch
function hitTest(sx, sy) {
  let best = null, bd = Infinity;
  for (const p of M.pieces) {
    const s = pieceScreen(p.id, T), d = Math.hypot(sx - s.x, sy - s.y);
    if (d < Math.max(22, s.r * 1.5) && d < bd) { bd = d; best = p; }
  }
  const b = ballScreen(T), db = Math.hypot(sx - b.x, sy - b.y);

cv.addEventListener('pointerdown', (e) => {
  sfx.unlock();

    if (hold > 0) { hold = 0; hideCaption(); return; }
    return setPlaying(!playing);
  }

  if (hit.kind === 'ball') {
    if (playing) setPlaying(false);
    grabs.set(e.pointerId, { kind: 'ball', w, s, t: performance.now() });
    if (rec.on) rec.aiming = true;
    sfx.pop(); buzz(8);
    return;
  }
  const p = byId[hit.id], pos = posAt(p.id, T);
  const g = { kind: 'player', id: p.id, off: { x: pos.x - w.x, y: pos.y - w.y }, w: pos, s, t: performance.now(), moved: false, path: [pos], last: -1 };

    pushUndo();
    g.mode = 'rec';
    const tr = (M.tracks[p.id] = (M.tracks[p.id] || []).filter((q) => q[0] < T));
    g.ghost = null;
    tr.push([+T.toFixed(3), +pos.x.toFixed(2), +pos.y.toFixed(2)]);
  } else {
    if (playing) setPlaying(false);
    g.mode = T < 0.05 ? 'place' : 'draw';
    if (g.mode === 'place') pushUndo();

    const p = byId[g.id], dx = np.x - g.w.x, dy = np.y - g.w.y;
    p.x += dx; p.y += dy;

  const L = segs[segs.length - 1], dur = Math.max(0.6, L / 6.2);
  const tr = (M.tracks[id] = (M.tracks[id] || []).filter((q) => q[0] < T));
  for (let t = 0; t <= dur + 1e-6; t += 0.05) {
    const d = easeIO(t / dur) * L;
    let i = 1; while (i < segs.length - 1 && segs[i] < d) i++;

    tr.push([+(T + t).toFixed(3), +lerp(path[i - 1].x, path[i].x, u).toFixed(2), +lerp(path[i - 1].y, path[i].y, u).toFixed(2)]);

function aimTarget(w) {

    if (near && near.d < 2.5) { M.holder0 = near.p.id; toast(`${numLabel(near.p.id)} (${TEAM[near.p.team].name}) börjar med bollen`); }

// ------------------------------------------------------------------ playback
function setPlaying(v) {

function advance(dt) {

  if (ch2.waiting || ch2.reveal || ch2.paused) return;
  let rate = speed;
  for (const g of sim.goals) if (T > g.t - 0.5 && T < g.t + 0.35) rate *= 0.4;
  const q = mode === 'challenge' && ch2.active ? questions[ch2.i] : null;
  if (q) { const gap = q.t - T; if (gap < 0.7) rate *= clamp(gap / 0.7, 0.12, 1); }
  ramp = Math.min(1, ramp + dt * 2); rate *= 0.25 + 0.75 * ramp;

  if (q && nt >= q.t - 0.03) { T = q.t - 0.03; ask(q); return; }
  if (mode === 'watch' || mode === 'create') {
    const m = M.markers.find((x) => x.t > T && x.t <= nt);
    if (m) {

  for (const g of sim.goals) if (g.t > T && g.t <= nt) celebrate(g);

function answer(a) {

  if (a === 'more') return moreSheet();
  if (a === 'speed') { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; renderControls(); return; }
  if (a === 'cam') { cam.mode = cam.mode === 'tv' ? 'top' : 'tv'; renderControls(); return; }
  if (a === 'follow') { cam.follow = !cam.follow; renderControls(); return; }
  if (a === 'cpause') { ch2.paused = !ch2.paused; renderControls(); return; }
  if (a === 'cquit') { ch2.active = false; ch2.waiting = null; ch2.reveal = null; $('#qcard').classList.remove('show'); setPlaying(false); showChallengeStart(); renderControls(); renderQDots(); updateHud(); return; }
  if (a === 'cstart') { $('#cend').hidden = true; showChallengeStart(); }
});

// ------------------------------------------------------------------ captions, toasts, big text
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function showCaption(text) { $('#capText').textContent = text; $('#caption').classList.add('show'); }
function hideCaption() { $('#caption').classList.remove('show'); }
function bigText(text, kind) {
  const b = $('#big'); b.textContent = text; b.className = 'big' + (kind === 'count' ? ' count' : '');
  void b.offsetWidth; b.classList.add('show');
}

// ------------------------------------------------------------------ sheets
function openSheet(title, html, mount) {
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  $('#sheet').hidden = false; $('#sheetBg').hidden = false;
  if (mount) mount($('#sheetBody'));
  setTimeout(() => $('#sheetX').focus(), 50);
}
function closeSheet() { $('#sheet').hidden = true; $('#sheetBg').hidden = true; }
$('#sheetX').addEventListener('click', closeSheet);
$('#sheetBg').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeSheet();
  if (e.target.closest('input, textarea')) return;
  if (e.key === ' ' && mode !== 'challenge') { e.preventDefault(); setPlaying(!playing); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && mode === 'create') { e.preventDefault(); undo(); }
  if (e.key === 'r' && mode === 'create') rec.on ? stopRecording() : startRecording();
});

const toggleRow = (key, title, sub, on) => `<button class="row" role="switch" aria-checked="${on}" data-key="${key}"><span><b>${title}</b><small>${sub}</small></span><span class="switch"></span></button>`;
function layersSheet() {
  const homeNums = M.pieces.filter((p) => p.team === 'home').map((p) => p.num).sort((a, b) => a - b);
  openSheet('Lager', `<div class="rows">
      ${toggleRow('paths', 'Spår', 'Vart alla springer och vart bollen går', opts.paths || mode === 'create')}
      ${toggleRow('lanes', 'Passningsvägar', 'Grönt = fritt att passa. Rött = en motståndare är i vägen', opts.lanes)}
      ${toggleRow('space', 'Ytor', `Vilket lag äger ytan just nu${spaceShare !== null && opts.space ? ` · Blå ${spaceShare} %` : ''}`, opts.space)}
      ${mode === 'watch' ? toggleRow('pauseNotes', 'Pausa vid kommentarer', 'Stannar en stund där tränaren skrivit något', opts.pauseNotes) : ''}
      ${mode === 'create' ? toggleRow('recSlow', 'Spela in i halvfart', 'Lättare att hinna med – spelas upp i matchtempo', rec.slow) : ''}
    </div>
    <div class="section-label">Kamera</div>
    <div class="seg" id="camSeg"><button aria-pressed="${cam.mode === 'top'}" data-v="top">Ovanifrån</button><button aria-pressed="${cam.mode === 'tv'}" data-v="tv">TV-vy</button></div>
    ${mode !== 'create' ? `<div class="section-label">Jag är nummer</div><div class="chips" style="display:flex;flex-wrap:wrap;gap:6px">${[null, ...homeNums].map((n) => `<button class="chip" aria-pressed="${me === n}" data-me="${n === null ? '' : n}">${n === null ? 'Ingen' : n}</button>`).join('')}</div>` : ''}`,
  (body) => {
    body.querySelectorAll('.row').forEach((r) => r.addEventListener('click', () => {
      const k = r.dataset.key, v = r.getAttribute('aria-checked') !== 'true';
      r.setAttribute('aria-checked', String(v));
      if (k === 'recSlow') { rec.slow = v; store.set('recSlow', v); } else { opts[k] = v; store.set(k, v); }
      if (k === 'paths' && mode === 'create' && !v) toast('I Skapa syns spåren alltid');
      sfx.pop();
    }));
    body.querySelectorAll('#camSeg button').forEach((b) => b.addEventListener('click', () => {
      cam.mode = b.dataset.v; body.querySelectorAll('#camSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderControls(); sfx.pop();
    }));
    body.querySelectorAll('[data-me]').forEach((c) => c.addEventListener('click', () => {
      me = c.dataset.me ? +c.dataset.me : null; store.set('me', me);
      body.querySelectorAll('[data-me]').forEach((x) => x.setAttribute('aria-pressed', String(x === c))); sfx.pop();
    }));
  });
}
function nextNum(team) { const used = new Set(M.pieces.filter((p) => p.team === team).map((p) => p.num)); let n = 2; while (used.has(n)) n++; return n; }
function moreSheet() {
  const notes = M.markers.slice().sort((a, b) => a.t - b.t);
  openSheet('Mer', `<div class="rows">
      <button class="row" data-a="addHome"><span><b>+ Blå spelare</b><small>Läggs på mittlinjen – dra dit den ska</small></span></button>
      <button class="row" data-a="addAway"><span><b>+ Röd spelare</b><small>Motståndare</small></span></button>
      <button class="row" data-a="note"><span><b>💬 Kommentar vid ${fmt(T)}</b><small>Visas som en textrad när övningen spelas</small></span></button>
      <button class="row" data-a="clear"><span><b>Rensa rörelser och passningar</b><small>Startuppställningen blir kvar</small></span></button>
      <button class="row" data-a="demo"><span><b>Börja om med exemplet</b><small>"Vänd spelet och avsluta"</small></span></button>
    </div>
    ${notes.length ? `<div class="section-label">Kommentarer</div><div class="notes">${notes.map((m) => `<div><time>${fmt(m.t)}</time><span>${esc(m.text)}</span><button data-del="${M.markers.indexOf(m)}" aria-label="Ta bort kommentaren">✕</button></div>`).join('')}</div>` : ''}`,
  (body) => {
    body.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () => {
      const a = b.dataset.a;
      if (a === 'addHome' || a === 'addAway') {
        pushUndo();
        const team = a === 'addHome' ? 'home' : 'away', id = team[0] + Math.random().toString(36).slice(2, 7);
        M.pieces.push({ id, team, num: nextNum(team), x: 34 + (Math.random() - 0.5) * 8, y: H - 4 });
        T = 0; dirty(); closeSheet(); toast('Spelaren står vid mittlinjen – dra den dit den ska'); return;
      }
      if (a === 'note') return noteSheet();
      if (a === 'clear') { pushUndo(); M.tracks = {}; M.events = []; M.markers = []; T = 0; dirty(); closeSheet(); toast('Rensat – ångra med ↶'); return; }
      if (a === 'demo') { pushUndo(); M = demoModel(); T = 0; dirty(); closeSheet(); toast('Exemplet är tillbaka'); }
    }));
    body.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => { pushUndo(); M.markers.splice(+b.dataset.del, 1); dirty(); moreSheet(); }));
  });
}
function noteSheet() {
  openSheet(`Kommentar vid ${fmt(T)}`, `<textarea class="field" id="noteText" maxlength="140" placeholder="T.ex. Här ska 8:an vända upp"></textarea>
    <div class="btnrow"><button class="btn" id="noteCancel">Avbryt</button><button class="btn primary" id="noteSave">Spara</button></div>`, (body) => {
    const ta = body.querySelector('#noteText'); setTimeout(() => ta.focus(), 80);
    body.querySelector('#noteCancel').onclick = closeSheet;
    body.querySelector('#noteSave').onclick = () => {
      const text = ta.value.trim();
      if (!text) return ta.focus();
      pushUndo(); M.markers.push({ t: +T.toFixed(2), text }); dirty(); closeSheet(); toast('Kommentaren är sparad');
    };
  });
}
function playerMenu(id) {
  const p = byId[id];
  openSheet(`${numLabel(id)} · ${TEAM[p.team].name}`, `<div class="section-label">Nummer</div>
    <input class="field" id="numIn" inputmode="numeric" maxlength="2" value="${p.num}">
    <div class="btnrow"><button class="btn" data-a="team">Byt lag</button><button class="btn" data-a="clear">Rensa rörelser</button></div>
    <div class="btnrow"><button class="btn danger" data-a="del">Ta bort</button><button class="btn primary" data-a="ok">Klar</button></div>`, (body) => {
    const inp = body.querySelector('#numIn');
    const commit = () => { const n = parseInt(inp.value, 10); if (n > 0 && n < 100 && n !== p.num) { pushUndo(); p.num = n; dirty(); } };
    body.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () => {
      const a = b.dataset.a;
      commit();
      if (a === 'team') { pushUndo(); p.team = p.team === 'home' ? 'away' : 'home'; dirty(); }
      if (a === 'clear') { pushUndo(); M.tracks[id] = []; dirty(); toast(`${numLabel(id)} står still nu`); }
      if (a === 'del') { pushUndo(); M.pieces = M.pieces.filter((x) => x.id !== id); delete M.tracks[id]; if (M.holder0 === id) { M.holder0 = null; } M.events = M.events.filter((e) => e.from !== id && e.to !== id); dirty(); }
      closeSheet();
    }));
  });
}
function newsSheet() {
  const items = [
    ['Spela in som i ett spel', 'Tryck Spela in och dra spelarna medan klockan går – i halvfart, så du hinner. Spela in en spelare i taget ovanpå de andra. Inga steg att hålla reda på, och det spelas upp i matchtempo.', 'create', 'rec'],
    ['Riktiga passningar och skott', 'Dra bollen till en medspelare så flyger den dit – långa bollar lyfts, och står en motståndare i vägen bryts passningen. Dra bollen in i målet för ett skott.', 'create', 'pass'],
    ['Utmaning för spelarna', 'Övningen stannar i rätt ögonblick: "Vem ska 8:an passa?" Spelaren trycker på svaret, får poäng och 🔥 för rätt i rad. Frågorna skapas av det tränaren spelat in.', 'challenge', ''],
    ['Smarta lager', 'Passningsvägar (grönt = fritt, rött = stängt), Ytor (vilket lag äger ytan) och Spår (vart alla ska). Bra att prata kring på genomgången.', 'watch', 'layers'],
    ['TV-vy och kamera som följer bollen', 'Samma plan lutad som på TV, med kameran efter bollen. Tränarens kommentarer kommer som textrader i rätt ögonblick, och det blir slow motion vid mål.', 'watch', 'tv'],
  ];
  openSheet('Tavlan 2.0 – fem nyheter', `<ol class="news">${items.map(([h, p], i) => `<li><div class="num">${i + 1}</div><div><h3>${h}</h3><p>${p}</p><button class="try" data-i="${i}">Prova →</button></div></li>`).join('')}</ol>
    <p class="fine">Det här är en testsida från Playbot. Inget i appen ändras förrän ni har sagt ja till förslaget. Det du gör här sparas bara i den här webbläsaren.</p>`, (body) => {
    body.querySelectorAll('.try').forEach((b) => b.addEventListener('click', () => {
      const [, , m, what] = items[+b.dataset.i];
      closeSheet(); setMode(m);
      if (what === 'rec') { T = 0; toast('Tryck ● Spela in och dra en blå spelare medan klockan går'); }
      if (what === 'pass') { T = 0.5; toast('Dra bollen från 6:an till en medspelare'); }
      if (what === 'layers') { opts.lanes = true; opts.space = true; store.set('lanes', true); store.set('space', true); cam.mode = 'top'; cam.follow = false; T = 0.9; setPlaying(false); renderControls(); toast('Grönt = fritt att passa · Ytorna visar vem som äger planen'); }
      if (what === 'tv') { cam.mode = 'tv'; cam.follow = true; T = 0; setPlaying(true); }
    }));
  });
  store.set('newsSeen', true);
}
$('#newsBtn').addEventListener('click', () => { sfx.unlock(); newsSheet(); });

function renderSound() { $('#soundBtn').innerHTML = sfx.on ? I.soundOn : I.soundOff; $('#soundBtn').setAttribute('aria-label', sfx.on ? 'Stäng av ljudet' : 'Slå på ljudet'); }
$('#soundBtn').addEventListener('click', () => { sfx.on = !sfx.on; renderSound(); if (sfx.on) sfx.pop(); });

// ------------------------------------------------------------------ modes
const modeTabs = document.querySelectorAll('.modes button');
const MODE_LABEL = { create: [I.pen, 'Skapa'], watch: [I.eye, 'Titta'], challenge: [I.trophy, 'Utmaning'] };
modeTabs.forEach((b) => { const [ic, t] = MODE_LABEL[b.dataset.mode]; b.innerHTML = ic + t; b.addEventListener('click', () => { sfx.unlock(); setMode(b.dataset.mode); }); });
function setMode(m) {
  if (rec.on) stopRecording();
  mode = m;
  modeTabs.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  closeSheet(); hold = 0; hideCaption();
  ch2.active = false; ch2.waiting = null; ch2.reveal = null; ch2.paused = false; $('#qcard').classList.remove('show');
  $('#cstart').hidden = true; $('#cend').hidden = true;
  $('#tlWrap').hidden = m === 'challenge';
  if (m === 'create') { setPlaying(false); cam.mode = 'top'; cam.follow = false; }
  if (m === 'watch') { cam.mode = 'tv'; cam.follow = true; if (T >= sim.dur - 0.05) T = 0; setPlaying(true); }
  if (m === 'challenge') { setPlaying(false); T = 0; cam.mode = 'tv'; cam.follow = false; showChallengeStart(); }
  renderTimeline(); renderControls(); renderQDots(); updateHud();
}

// ------------------------------------------------------------------ loop
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (rec.on) {
    if (!rec.aiming) T = Math.min(60, T + dt * (rec.slow ? 0.5 : 1));
    recordFrame();
  } else if (playing) advance(dt);
  for (const [id, v] of lift) lift.set(id, v + ((grabs.size && [...grabs.values()].some((g) => g.id === id) ? 1.18 : 1) - v) * 0.3);
  updateCamera(dt);
  drawFrame(now);
  updateHud();
  rafId = requestAnimationFrame(loop);
}
let rafId = 0;

// ------------------------------------------------------------------ start
dirty();
renderSound();
resize();
const qm = new URLSearchParams(location.search).get('mode');
setMode(['create', 'watch', 'challenge'].includes(qm) ? qm : 'watch');
if (!store.get('newsSeen', false)) setTimeout(() => toast('Förslag från Playbot – tryck "Vad är nytt?"'), 1200);
document.fonts && document.fonts.ready.then(() => renderControls());
rafId = requestAnimationFrame(loop);
// For testing the page from the browser's console.
window.__tavlan = { state: () => ({ T, mode, playing, dur: sim.dur, questions: questions.map((q) => ({ type: q.type, t: q.t, who: q.who, answer: q.answer })), ch: { ...ch2 } }), screenOf: (id) => pieceScreen(id, T), worldToScreen: (x, y) => toScreen(x, y), kick: () => { cancelAnimationFrame(rafId); last = performance.now(); loop(last); } };
})();
</script>
</body>
</html>
